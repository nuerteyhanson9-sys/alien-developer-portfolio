function cn() {
  return Array.prototype.slice.call(arguments).filter(Boolean).join(" ");
}
function formatGHS(n) {
  return "GH₵ " + Number(n || 0).toLocaleString("en-GH");
}
function todayISO() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + day;
}
function addDaysISO(iso, days) {
  const parts = iso.split("-").map(Number);
  const dt = new Date(parts[0], parts[1] - 1, parts[2]);
  dt.setDate(dt.getDate() + days);
  const mm = String(dt.getMonth() + 1).padStart(2, "0");
  const dd = String(dt.getDate()).padStart(2, "0");
  return dt.getFullYear() + "-" + mm + "-" + dd;
}
function nightsBetween(a, b) {
  if (!a || !b) return null;
  const ap = a.split("-").map(Number);
  const bp = b.split("-").map(Number);
  const ms = new Date(bp[0], bp[1] - 1, bp[2]) - new Date(ap[0], ap[1] - 1, ap[2]);
  const n = Math.round(ms / 86400000);
  return n > 0 ? n : null;
}
function formatDate(iso) {
  if (!iso) return "";
  const p = iso.split("-").map(Number);
  return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
}
function useLockBody(active) {
  useEffect(() => {
    if (!active) return;
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = prev; };
  }, [active]);
}
function useEscape(active, onEscape) {
  useEffect(() => {
    if (!active) return;
    const handler = (e) => { if (e.key === "Escape") onEscape(); };
    document.addEventListener("keydown", handler);
    return () => document.removeEventListener("keydown", handler);
  }, [active, onEscape]);
}
function trapTabKey(e, ref) {
  if (e.key !== "Tab" || !ref.current) return;
  const nodes = ref.current.querySelectorAll('a[href], button:not([disabled]), textarea, input:not([type="hidden"]), select, [tabindex]:not([tabindex="-1"])');
  if (!nodes.length) return;
  const first = nodes[0];
  const last = nodes[nodes.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
}

function Reveal({ children, delay = 0, className = "" }) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (!("IntersectionObserver" in window)) { setVis(true); return; }
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            setVis(true);
            io.disconnect();
          }
        });
      },
      { rootMargin: "-64px" }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return (
    <div ref={ref} style={{ transitionDelay: delay + "s" }} className={cn("reveal", vis && "is-visible", className)}>
      {children}
    </div>
  );
}

function ModalShell({ open, onClose, onOverlayClick, labelledBy, variant = "center", maxClass = "max-w-md", z = "z-[70]", children }) {
  const [render, setRender] = useState(open);
  const [shown, setShown] = useState(false);
  const panelRef = useRef(null);

  useEffect(() => {
    let t;
    if (open) {
      setRender(true);
      const raf = requestAnimationFrame(() =>
        requestAnimationFrame(() => setShown(true))
      );
      return () => cancelAnimationFrame(raf);
    }
    setShown(false);
    t = setTimeout(() => setRender(false), 480);
    return () => clearTimeout(t);
  }, [open]);

  useLockBody(open);
  useEscape(open, onClose);

  useEffect(() => {
    if (open && render && panelRef.current) panelRef.current.focus();
  }, [open, render]);

  if (!render) return null;

  const overlayCls = cn(
    "absolute inset-0 bg-ink/60 backdrop-blur-sm transition-opacity duration-[420ms]",
    shown ? "opacity-100" : "opacity-0"
  );
  const panelBase =
    variant === "right"
      ? "absolute right-0 top-0 flex h-full w-full flex-col bg-ivory shadow-2xl outline-none transition-transform duration-500 ease-[cubic-bezier(0.22,1,0.36,1)] "
      : "relative flex max-h-[94svh] w-full flex-col overflow-hidden rounded-t-3xl bg-ivory shadow-2xl outline-none transition-all duration-500 ease-[cubic-bezier(0.22,1,0.36,1)] sm:rounded-3xl ";
  const panelState =
    variant === "right"
      ? shown ? "translate-x-0" : "translate-x-full"
      : shown ? "translate-y-0 opacity-100" : "translate-y-10 opacity-0";

  return (
    <div
      className={cn("fixed inset-0", z, variant === "center" && "flex items-end justify-center overflow-y-auto sm:items-center sm:p-6")}
      role="dialog"
      aria-modal="true"
      aria-labelledby={labelledBy}
      onKeyDown={(e) => trapTabKey(e, panelRef)}
    >
      <div className={overlayCls} onClick={onOverlayClick || onClose} />
      <div
        ref={panelRef}
        tabIndex={-1}
        className={cn(panelBase, panelState, maxClass)}
      >
        {children}
      </div>
    </div>
  );
}

function DurationSelector({ value, onChange }) {
  const OPTIONS = [2, 4, 6];
  const tabRefs = useRef([]);
  function handleKey(e, index) {
    let next = null;
    if (e.key === "ArrowRight") next = (index + 1) % OPTIONS.length;
    else if (e.key === "ArrowLeft") next = (index - 1 + OPTIONS.length) % OPTIONS.length;
    else if (e.key === "Home") next = 0;
    else if (e.key === "End") next = OPTIONS.length - 1;
    if (next !== null) {
      e.preventDefault();
      if (tabRefs.current[next]) tabRefs.current[next].focus();
      onChange(OPTIONS[next]);
    }
  }
  return (
    <div role="tablist" aria-label="Choose your stay length" className="inline-flex rounded-full border border-charcoal/15 bg-white/70 p-1 shadow-sm backdrop-blur">
      {OPTIONS.map((nights, index) => {
        const active = value === nights;
        return (
          <button
            key={nights}
            ref={(el) => { tabRefs.current[index] = el; }}
            type="button"
            role="tab"
            id={"duration-tab-" + nights}
            aria-selected={active}
            aria-controls="itinerary-panel"
            tabIndex={active ? 0 : -1}
            onClick={() => onChange(nights)}
            onKeyDown={(e) => handleKey(e, index)}
            className={cn(
              "relative rounded-full px-5 py-2.5 text-[11px] font-bold uppercase tracking-[0.2em] transition-colors duration-300 sm:px-7 sm:text-xs",
              active ? "text-ink" : "text-charcoal/55 hover:text-charcoal"
            )}
          >
            {active && <span className="pill-in absolute inset-0 rounded-full bg-gold" />}
            <span className="relative z-10">{nights} nights</span>
          </button>
        );
      })}
    </div>
  );
}

function Stepper({ label, hint, value, min, max, onChange }) {
  const btn = cn(
    "grid h-8 w-8 place-items-center rounded-full border transition active:scale-95",
    value <= min || value >= max
      ? "border-charcoal/10 text-charcoal/25"
      : "border-charcoal/25 text-charcoal hover:border-gold hover:text-gold-deep"
  );
  return (
    <div className="flex items-center justify-between rounded-xl border border-charcoal/10 bg-white px-4 py-3.5">
      <div>
        <p className="text-sm font-semibold text-charcoal">{label}</p>
        {hint && <p className="text-xs text-charcoal/50">{hint}</p>}
      </div>
      <div className="flex items-center gap-3">
        <button type="button" aria-label={"Decrease " + label} disabled={value <= min} onClick={() => onChange(Math.max(min, value - 1))} className={btn}>
          <Icon name="minus" className="h-3.5 w-3.5" />
        </button>
        <span aria-live="polite" className="w-6 text-center text-sm font-bold tabular-nums text-charcoal">
          {value}
        </span>
        <button type="button" aria-label={"Increase " + label} disabled={value >= max} onClick={() => onChange(Math.min(max, value + 1))} className={btn}>
          <Icon name="plus" className="h-3.5 w-3.5" />
        </button>
      </div>
    </div>
  );
}

function DateSelectorStep({ form, errors, onUpdate }) {
  const today = todayISO();
  const nights = nightsBetween(form.checkIn, form.checkOut);
  return (
    <div>

        <Field id="check-in" label="Check-in" error={errors.checkIn}>
          <input
            id="check-in"
            type="date"
            value={form.checkIn}
            min={today}
            onChange={(e) => {
              const checkIn = e.target.value;
              const invalidOut = form.checkOut && checkIn && form.checkOut <= checkIn;
              onUpdate(invalidOut ? { checkIn: checkIn, checkOut: "" } : { checkIn: checkIn });
            }}
            className={inputCls(errors.checkIn)}
          />
        </Field>

        <Field
          id="check-out"
          label="Check-out"
          error={errors.checkOut}
          hint={form.checkIn ? "Minimum " + addDaysISO(form.checkIn, 1) : undefined}
        >
          <input
            id="check-out"
            type="date"
            value={form.checkOut}
            min={form.checkIn ? addDaysISO(form.checkIn, 1) : addDaysISO(today, 1)}
            onChange={(e) => onUpdate({ checkOut: e.target.value })}
            className={inputCls(errors.checkOut)}
          />
        </Field>
      </div>

      <div className="mt-5 flex items-center gap-3 rounded-xl bg-linen/70 px-4 py-3.5 text-sm text-charcoal">
        <Icon name="calendar" className="h-4 w-4 shrink-0 text-gold-deep" />

          <React.Fragment>
            <span>
              {nights} night{nights > 1 ? "s" : ""} at BeKind

              <span className="ml-auto rounded-full bg-gold/20 px-3 py-1 text-[11px] font-bold text-gold-deep">
                Long-stay rates apply
              </span>
            )}
          </React.Fragment>
        ) : (
          <span>Select your dates to see the length of your stay.</span>

      </div>

      <p className="mt-3 text-xs text-charcoal/45">
        Flexible dates? Mention it in special requests — we’ll find your best rate.

    </div>
  );
}

const STEP_LABELS = ["Dates", "Guests", "Room", "Details", "Review"];
const STEP_TITLES = ["Choose your dates", "Who’s coming?", "Pick your room", "Your details", "Almost there"];

function emptyForm(presetRoomId) {
  return {
    checkIn: "",
    checkOut: "",
    adults: 2,
    children: 0,
    rooms: 1,
    roomId: presetRoomId || null,
    fullName: "",
    email: "",
    phone: "",
    country: "",
    requests: ""
  };
}

function BookingModal({ open, presetRoomId, onClose }) {
  const [step, setStep] = useState(0);
  const [form, setForm] = useState(emptyForm());
  const [errors, setErrors] = useState({});
  const [submitting, setSubmitting] = useState(false);
  const [reference, setReference] = useState(null);

  useEffect(() => {
    if (open) {
      setForm(emptyForm(presetRoomId));
      setStep(0);
      setErrors({});
      setReference(null);
      setSubmitting(false);
    }
  }, [open, presetRoomId]);

  function update(patch) {
    setForm((f) => Object.assign({}, f, patch));
    setErrors((prev) => {
      const next = Object.assign({}, prev);
      Object.keys(patch).forEach((key) => delete next[key]);
      return next;
    });
  }

  function validate(target) {
    const e = {};
    if (target >= 0) {
      if (!form.checkIn) e.checkIn = "Please choose a check-in date.";
      else if (form.checkIn < todayISO()) e.checkIn = "Check-in can’t be in the past.";
      if (!form.checkOut) e.checkOut = "Please choose a check-out date.";
      else {
        const n = nightsBetween(form.checkIn, form.checkOut);
        if (n === null) e.checkOut = "Check-out must be after check-in.";
        else if (n > 30) e.checkOut = "For stays longer than 30 nights, please contact us directly.";
      }
    }
    if (target >= 2) {
      const room = ROOMS.find((r) => r.id === form.roomId);
      if (!room) e.roomId = "Choose a room to continue.";
      else {
        const guests = form.adults + form.children;
        if (room.capacity * form.rooms < guests)
          e.roomId = "Your party of " + guests + " needs more space — add another room or pick the Family Villa.";
      }
    }
    if (target >= 3) {
      if (!form.fullName.trim() || form.fullName.trim().length < 2) e.fullName = "Please enter your full name.";
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(form.email.trim())) e.email = "Enter a valid email address.";
      const digits = form.phone.replace(/\D/g, "");
      if (digits.length < 8 || digits.length > 15) e.phone = "Enter a valid phone number.";
      if (!form.country) e.country = "Please select your country.";
    }
    return e;
  }

  function goNext() {
    const errs = validate(step);
    setErrors(errs);
    if (Object.keys(errs).length > 0) return;
    if (step < STEP_LABELS.length - 1) {
      setStep(step + 1);
    } else {
      setSubmitting(true);
      window.setTimeout(() => {
        setSubmitting(false);
        setReference("BK-" + Math.random().toString(36).slice(2, 8).toUpperCase());
      }, 900);
    }
  }

  function goBack() {
    setErrors({});
    setStep(Math.max(0, step - 1));
  }

  function handleClose() {
    if (!submitting) onClose();
  }

  const room = ROOMS.find((r) => r.id === form.roomId);
  const nights = nightsBetween(form.checkIn, form.checkOut);
  const guests = form.adults + form.children;
  const total = room && nights ? room.pricePerNight * nights * form.rooms : 0;

  const waMessage =
    reference && room && nights
      ? encodeURIComponent(
          "Hello BeKind! I’d like to confirm booking " + reference + ".\n" +
            room.name + "\n" +
            formatDate(form.checkIn) + " → " + formatDate(form.checkOut) + " (" + nights + " night" + (nights > 1 ? "s" : "") + ")\n" +
            guests + " guest(s), " + form.rooms + " room(s)\n" +
            "Total estimate: " + formatGHS(total) + "\n" +
            "Name: " + form.fullName
        )
      : "";

  return (
    <ModalShell
      open={open}
      onClose={handleClose}
      onOverlayClick={handleClose}
      labelledBy="booking-title"
      variant="center"
      maxClass="max-w-2xl"
      z="z-[80]"
    >
      {!reference ? (
        <React.Fragment>
          <header className="border-b border-charcoal/10 px-6 pb-4 pt-6 sm:px-8">
            <div className="flex items-start justify-between gap-4">
              <div>
                <p className="eyebrow text-gold-deep">Stay at BeKind</p>
                <h3 id="booking-title" className="mt-1 font-display text-2xl text-charcoal sm:text-3xl">
                  {STEP_TITLES[step]}
                </h3>
              </div>
              <button
                type="button"
                onClick={handleClose}
                aria-label="Close booking"
                className="grid h-10 w-10 shrink-0 place-items-center rounded-full border border-charcoal/15 text-charcoal transition-colors hover:border-gold hover:text-gold-deep"
              >
                <Icon name="x" />
              </button>
            </div>

            <div className="mt-5 flex gap-1.5" aria-hidden="true">
              {STEP_LABELS.map((label, i) => (
                <span key={label} className={cn("h-1 flex-1 rounded-full transition-colors duration-500", i <= step ? "bg-gold" : "bg-charcoal/10")} />
              ))}
            </div>
            <p className="mt-2.5 text-[11px] font-bold uppercase tracking-[0.18em] text-charcoal/55">
              Step {step + 1} of {STEP_LABELS.length} — {STEP_LABELS[step]}
              {room && step !== 2 && (
                <span className="normal-case tracking-normal text-charcoal/45"> · {room.name}</span>
              )}
            </p>
          </header>

          <div className="min-h-[320px] flex-1 overflow-y-auto px-6 py-6 sm:px-8">
            <div key={step} className="anim-step">
              {step === 0 && <DateSelectorStep form={form} errors={errors} onUpdate={update} />}
              {step === 1 && <GuestSelectorStep form={form} onUpdate={update} />}
              {step === 2 && (
                <RoomPicker
                  selectedId={form.roomId}
                  guests={guests}
                  roomsCount={form.rooms}
                  error={errors.roomId}
                  onSelect={(roomId) => update({ roomId })}
                />
              )}
              {step === 3 && <DetailsStep form={form} errors={errors} onUpdate={update} />}
              {step === 4 && (
                <ReviewStep
                  form={form}
                  nights={nights || 0}
                  total={total}
                  onJump={(target) => {
                    setErrors({});
                    setStep(target);
                  }}
                />
              )}
            </div>
          </div>

          <footer className="border-t border-charcoal/10 px-6 py-5 sm:px-8">
            <div className="flex items-center gap-3">
              {step > 0 && (
                <Button variant="outlineDark" onClick={goBack}>
                  <Icon name="arrowLeft" />
                  Back
                </Button>
              )}
              <Button className="flex-1" onClick={goNext} disabled={submitting}>
                {submitting ? (
                  <React.Fragment>
                    <Icon name="loader" className="h-4 w-4 animate-spin" />
                    Sending…
                  </React.Fragment>
                ) : step === STEP_LABELS.length - 1 ? (
                  "Confirm booking"
                ) : (
                  <React.Fragment>
                    Continue
                    <Icon name="arrowRight" />
                  </React.Fragment>
                )}
              </Button>
            </div>
          </footer>
        </React.Fragment>
      ) : (
        open && (
          <Confirmation
            reference={reference}
            firstName={form.fullName.trim().split(" ")[0]}
            roomName={room ? room.name : ""}
            dates={
              nights
                ? formatDate(form.checkIn) + " → " + formatDate(form.checkOut) + " · " + nights + " night" + (nights > 1 ? "s" : "")
                : ""
            }
            guests={
              guests + " guest" + (guests === 1 ? "" : "s") + " · " + form.rooms + " room" + (form.rooms > 1 ? "s" : "")
            }
            total={total}
            waHref={CONTACT.whatsappHref + "?text=" + waMessage}
            onDone={onClose}
          />
        )
      )}
    </ModalShell>
  );
}

function TripGroup({ group, selected, onToggle }) {
  const options = TRIP_OPTIONS.filter((o) => o.group === group);
  return (
    <section>
      <h4 className="mb-3 text-[11px] font-bold uppercase tracking-[0.22em] text-charcoal/50">{GROUP_LABELS[group]}</h4>
      <div className="flex flex-wrap gap-2">
        {options.map((option) => {
          const on = selected.has(option.id);
          return (
            <button
              key={option.id}
              type="button"
              aria-pressed={on}
              onClick={() => onToggle(option.id)}
              className={cn(
                "rounded-full border px-3.5 py-2 text-xs font-semibold transition-all active:scale-95",
                on
                  ? "border-ink bg-ink text-ivory shadow-sm"
                  : "border-charcoal/15 bg-white text-charcoal/75 hover:border-charcoal/40 hover:text-charcoal"
              )}
            >
              {option.label}
              <span className={cn("ml-1.5", on ? "text-accent" : "text-charcoal/40")}>{formatGHS(option.price)}</span>
            </button>
          );
        })}
      </div>
    </section>
  );
}

function TripBuilder({ open, onClose, onContinue }) {
  const [nights, setNights] = useState(4);
  const [roomId, setRoomId] = useState(ROOMS[1].id);
  const [selected, setSelected] = useState(new Set());
  const [transfer, setTransfer] = useState(false);

  const room = ROOMS.find((r) => r.id === roomId) || ROOMS[0];

  const summaryLines = useMemo(() => {
    const lines = [
      {
        id: "stay",
        label: nights + " night" + (nights > 1 ? "s" : "") + " · " + room.name,
        amount: nights * room.pricePerNight
      }
    ];
    selected.forEach((id) => {
      const option = TRIP_OPTIONS.find((o) => o.id === id);
      if (option)
        lines.push({
          id: id,
          label: option.label,
          amount: option.price,
          onRemove: () =>
            setSelected((prev) => {
              const next = new Set(prev);
              next.delete(id);
              return next;
            })
        });
    });
    if (transfer)
      lines.push({
        id: "transfer",
        label: "Airport transfer — return",
        amount: TRANSFER_PRICE,
        onRemove: () => setTransfer(false)
      });
    return lines;
  }, [nights, room, selected, transfer]);

  const total = summaryLines.reduce((sum, line) => sum + line.amount, 0);

  function toggle(id) {
    setSelected((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  }

  function reset() {
    setSelected(new Set());
    setTransfer(false);
  }

  const waText = encodeURIComponent(
    "Hello BeKind! Here’s my dream stay:\n• " + nights + " nights — " + room.name + "\n" +
      summaryLines
        .slice(1)
        .map((l) => "• " + l.label)
        .join("\n") +
      (summaryLines.length > 1 ? "\n" : "") +
      "\nEstimated total: " + formatGHS(total) + ". Please advise."
  );

  return (
    <ModalShell open={open} onClose={onClose} labelledBy="trip-builder-title" variant="right" maxClass="max-w-[460px]" z="z-[70]">
      <header className="flex items-start justify-between gap-4 border-b border-charcoal/10 p-6">
        <div>
          <p className="eyebrow text-gold-deep">Trip builder</p>
          <h3 id="trip-builder-title" className="mt-1 font-display text-2xl text-charcoal sm:text-[1.7rem]">
            Your Ghana experience
          </h3>
        </div>
        <button
          type="button"
          onClick={onClose}
          aria-label="Close trip builder"
          className="grid h-10 w-10 shrink-0 place-items-center rounded-full border border-charcoal/15 text-charcoal transition-colors hover:border-gold hover:text-gold-deep"
        >
          <Icon name="x" />
        </button>
      </header>

      <div className="flex-1 space-y-9 overflow-y-auto px-6 py-7">
        <section>
          <h4 className="mb-3 text-[11px] font-bold uppercase tracking-[0.22em] text-charcoal/50">Stay</h4>
          <Stepper label="Nights at BeKind" value={nights} min={1} max={14} onChange={setNights} />
          <div className="mt-3 space-y-2.5" role="radiogroup" aria-label="Choose accommodation">
            {ROOMS.map((r) => {
              const activeRoom = r.id === roomId;
              return (
                <label
                  key={r.id}
                  className={cn(
                    "flex cursor-pointer items-center justify-between gap-3 rounded-xl border px-4 py-3 transition-all",
                    activeRoom ? "border-gold bg-gold/[0.06]" : "border-charcoal/10 bg-white hover:border-charcoal/30"
                  )}
                >
                  <span className="min-w-0 flex-1">
                    <input type="radio" name="trip-room" checked={activeRoom} onChange={() => setRoomId(r.id)} className="sr-only" />
                    <span className="block truncate text-sm font-semibold text-charcoal">{r.name}</span>
                    <span className="text-xs text-charcoal/50">{formatGHS(r.pricePerNight)} / night</span>
                  </span>
                  <span
                    aria-hidden="true"
                    className={cn(
                      "grid h-[22px] w-[22px] shrink-0 place-items-center rounded-full border transition-colors",
                      activeRoom ? "border-gold bg-gold text-ink" : "border-charcoal/20 text-transparent"
                    )}
                  >
                    <Icon name="check" className="h-3 w-3" />
                  </span>
                </label>
              );
            })}
          </div>
        </section>

        {GROUP_ORDER.map((group) => (
          <TripGroup key={group} group={group} selected={selected} onToggle={toggle} />
        ))}

        <section>
          <h4 className="mb-3 text-[11px] font-bold uppercase tracking-[0.22em] text-charcoal/50">Logistics</h4>
          <button
            type="button"
            aria-pressed={transfer}
            onClick={() => setTransfer((v) => !v)}
            className={cn(
              "flex w-full items-center gap-3 rounded-xl border px-4 py-3.5 text-left transition-all",
              transfer ? "border-gold bg-gold/[0.06]" : "border-charcoal/10 bg-white"
            )}
          >
            <Icon name="plane" className={cn("h-4 w-4 shrink-0", transfer ? "text-gold-deep" : "text-charcoal/40")} />
            <span className="flex-1">
              <span className="block text-sm font-semibold text-charcoal">Airport transfer — return trip</span>
              <span className="text-xs text-charcoal/50">Takoradi or Accra · {formatGHS(TRANSFER_PRICE)}</span>
            </span>
            <span aria-hidden="true" className={cn("relative h-6 w-11 shrink-0 rounded-full p-0.5 transition-colors", transfer ? "bg-gold" : "bg-charcoal/20")}>
              <span className={cn("block h-5 w-5 rounded-full bg-white shadow transition-transform", transfer && "translate-x-5")} />
            </span>
          </button>
        </section>

        <section className="rounded-2xl border border-charcoal/10 bg-white p-5">
          <div className="flex items-baseline justify-between">
            <h4 className="text-[11px] font-bold uppercase tracking-[0.22em] text-charcoal/50">Trip summary</h4>
            {(selected.size > 0 || transfer) && (
              <button
                type="button"
                onClick={reset}
                className="text-[11px] font-semibold uppercase tracking-wider text-charcoal/45 underline underline-offset-4 transition hover:text-charcoal"
              >
                Clear extras
              </button>
            )}
          </div>
          <ul className="mt-3 max-h-52 space-y-2 overflow-y-auto pr-1">
            {summaryLines.map((line) => (
              <li key={line.id} className="flex items-center justify-between gap-3 text-sm">
                <span className="min-w-0 flex-1 truncate text-charcoal/75">{line.label}</span>
                <span className="shrink-0 font-semibold tabular-nums text-charcoal">{formatGHS(line.amount)}</span>
                {line.onRemove && (
                  <button
                    type="button"
                    onClick={line.onRemove}
                    aria-label={"Remove " + line.label}
                    className="grid h-5 w-5 shrink-0 place-items-center rounded-full border border-charcoal/15 text-charcoal/40 transition hover:border-red-300 hover:text-red-500"
                  >
                    <Icon name="x" className="h-3 w-3" />
                  </button>
                )}
              </li>
            ))}
          </ul>
          <div className="mt-4 flex items-baseline justify-between gap-4 border-t border-charcoal/10 pt-4">
            <span className="text-[11px] font-bold uppercase tracking-[0.2em] text-charcoal/50">Estimated total</span>
            <span key={total} className="num-pop font-display text-2xl text-gold-deep">
              {formatGHS(total)}
            </span>
          </div>
          <p className="mt-2 text-[11px] italic text-charcoal/45">Indicative estimate — we’ll confirm your exact rate.</p>
        </section>
      </div>

      <footer className="border-t border-charcoal/10 bg-white/60 px-6 py-5 backdrop-blur">
        <div className="flex items-center gap-3">
          <Button className="flex-1" onClick={() => onContinue(roomId)}>
            Continue planning
          </Button>
          <a
            href={CONTACT.whatsappHref + "?text=" + waText}
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Send this plan to BeKind on WhatsApp"
            className="grid h-12 w-12 shrink-0 place-items-center rounded-full border border-palm/40 text-palm transition-colors hover:bg-palm hover:text-ivory"
          >
            <Icon name="message" className="h-5 w-5" />
          </a>
        </div>
      </footer>
    </ModalShell>
  );
}

                <a href={"mailto:" + CONTACT.email} className="block transition-colors hover:text-accent">
                  {CONTACT.email}
                </a>
              </div>
              <Button
                size="lg"
                className="w-full"
                onClick={() => {
                  setOpen(false);
                  onOpenBooking();
                }}
              >
                Stay in Ghana
              </Button>
            </div>
          </nav>
        </div>
      )}
    </React.Fragment>
  );
}

function Hero({ onOpenBooking }) {
  const bgRef = useRef(null);
  const sectionRef = useRef(null);

  useEffect(() => {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    let raf = 0;
    const onScroll = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        if (bgRef.current) {
          const y = Math.min(window.scrollY * 0.35, 180);
          bgRef.current.style.transform = "translateY(" + y + "px)";
        }
      });
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => {
      window.removeEventListener("scroll", onScroll);
      cancelAnimationFrame(raf);
    };
  }, []);

  return (
    <section ref={sectionRef} id="home" className="relative flex h-[92svh] max-h-[1000px] min-h-[600px] items-center justify-center overflow-hidden bg-ink">
      <div ref={bgRef} className="absolute inset-[-3%]">
        <div className="kb absolute inset-0">
          <Img src={IMG.heroBeach} alt="Golden sand shoreline meeting turquoise ocean in Takoradi, Ghana" eager />
        </div>
      </div>

      <div className="absolute inset-0 bg-gradient-to-b from-ink/55 via-ink/20 to-ink/85" />

      <div className="container-x relative z-10 pb-16 text-center text-ivory">
        <p style={{ animationDelay: "0.3s" }} className="hero-item eyebrow text-accent">
          Stay at BeKind
        </p>

        <h1
          style={{ animationDelay: "0.43s" }}
          className="hero-item mx-auto mt-6 max-w-4xl font-display text-[clamp(2.9rem,8.5vw,6.5rem)] leading-[1.04] text-balance"
        >
          Where <em className="italic text-gold-light">Dreams</em> Come True
        </h1>

        <p style={{ animationDelay: "0.56s" }} className="hero-item mx-auto mt-7 max-w-2xl text-base leading-relaxed text-ivory/85 sm:text-lg">
          Your all-in-one Ghana travel experience — where the beach, culture,
          adventure and relaxation come together.
        </p>

        <div style={{ animationDelay: "0.69s" }} className="hero-item mt-10 flex flex-wrap items-center justify-center gap-4">
          <Button size="lg" onClick={onOpenBooking}>
            Plan Your Stay
          </Button>
          <Button variant="outlineLight" size="lg" href="#experiences">
            Explore Experiences
          </Button>
        </div>
      </div>

      <a
        href="#intro"
        aria-label="Scroll down to explore your stay"
        style={{ animationDelay: "1.6s" }}
        className="hero-fade absolute bottom-7 left-1/2 z-10 -translate-x-1/2 p-2 text-ivory/80 transition-colors hover:text-accent"
      >
        <span className="flex h-11 w-7 items-start justify-center rounded-full border border-current p-1.5">
          <span className="animate-scroll-dot block h-2 w-1 rounded-full bg-current" />
        </span>
      </a>
    </section>
  );
}

function CTASection({ onOpenBooking, onOpenPlanner }) {
  return (
    <section className="relative overflow-hidden bg-ink py-28 text-ivory sm:py-36">
      <div className="absolute inset-0 opacity-30">
        <Img src={IMG.sunsetBeach} alt="" />
      </div>
      <div className="absolute inset-0 bg-gradient-to-b from-ink via-ink/55 to-ink" />

      <Reveal className="container-x relative z-10 mx-auto max-w-2xl text-center">
        <p className="eyebrow text-accent">Ready when you are</p>
        <h2 className="mt-4 font-display text-4xl leading-[1.08] text-balance sm:text-5xl lg:text-6xl">
          Inspired? Let’s plan your dates.
        </h2>
        <p className="mt-6 text-base leading-relaxed text-ivory/75 sm:text-lg">
          Choose your room and start building your Ghana experience — our team
          shapes the rest around you.
        </p>
        <div className="mt-10 flex flex-wrap items-center justify-center gap-4">
          <Button size="lg" onClick={onOpenBooking}>
            Choose Your Room
            <Icon name="arrowRight" />
          </Button>
          <Button variant="outlineLight" size="lg" href={"mailto:" + CONTACT.email + "?subject=" + encodeURIComponent("Stay enquiry — BeKind Hotel & Suites")}>
            Contact BeKind
          </Button>
        </div>
        <button
          type="button"
          onClick={onOpenPlanner}
          className="mt-8 text-sm text-ivory/60 underline decoration-gold/50 underline-offset-4 transition hover:text-accent"
        >
          or build your trip experience-by-experience
        </button>
      </Reveal>
    </section>
  );
}

  const socials = [
    { label: "Instagram (coming soon)", href: "#", icon: "instagram" },
    { label: "Facebook (coming soon)", href: "#", icon: "facebook" },

  ];

  return (
    <footer id="about" className="scroll-mt-20 bg-ink pb-28 pt-20 text-ivory/75 md:pb-10">

      <div className="container-x grid gap-12 lg:grid-cols-12">
        <div className="lg:col-span-5">
          <Logo tone="light" />
          <p className="mt-6 max-w-sm font-display text-2xl italic leading-snug text-ivory/85">
            “Ghana is Africa for beginners.” We’re your guide.
          </p>
          <div className="mt-8 flex gap-3">
            {socials.map((social) => (
              <a
                key={social.label}
                href={social.href}
                target={social.href.indexOf("http") === 0 ? "_blank" : undefined}
                rel={social.href.indexOf("http") === 0 ? "noopener noreferrer" : undefined}
                aria-label={social.label}
                className="grid h-10 w-10 place-items-center rounded-full border border-ivory/20 text-ivory/70 transition-colors hover:border-gold hover:text-accent"
              >
                <Icon name={social.icon} />
              </a>
            ))}
          </div>
        </div>

        <nav aria-label="Footer" className="lg:col-span-2">
          <h3 className="text-[11px] font-bold uppercase tracking-[0.24em] text-ivory/45">Explore</h3>
          <ul className="mt-5 space-y-3 text-sm">
            {NAV_LINKS.map((link) => (
              <li key={link.label}>
                <a href={link.href} className="transition-colors hover:text-accent">
                  {link.label}
                </a>
              </li>
            ))}
          </ul>
        </nav>

        <div className="lg:col-span-3" id="contact">
          <h3 className="text-[11px] font-bold uppercase tracking-[0.24em] text-ivory/45">Contact</h3>
          <ul className="mt-5 space-y-3.5 text-sm">
            <li className="flex gap-3">
              <Icon name="mail" className="mt-0.5 h-4 w-4 shrink-0 text-gold" />
              <a href={"mailto:" + CONTACT.email} className="break-all transition-colors hover:text-accent">
                {CONTACT.email}
              </a>
            </li>
            <li className="flex gap-3">
              <Icon name="phone" className="mt-0.5 h-4 w-4 shrink-0 text-gold" />
              <a href={CONTACT.phoneHref} className="transition-colors hover:text-accent">
                +233 50 912 0845
              </a>
            </li>
            <li className="flex gap-3">
              <Icon name="message" className="mt-0.5 h-4 w-4 shrink-0 text-gold" />
              <a href={CONTACT.whatsappHref} target="_blank" rel="noopener noreferrer" className="transition-colors hover:text-accent">
                WhatsApp us anytime
              </a>
            </li>
          </ul>
        </div>

        <div className="lg:col-span-2">
          <h3 className="text-[11px] font-bold uppercase tracking-[0.24em] text-ivory/45">Visit</h3>
          <address className="mt-5 flex gap-3 text-sm not-italic leading-relaxed">
            <Icon name="mapPin" className="mt-0.5 h-4 w-4 shrink-0 text-gold" />
            <span>
              Ako Adjei Street
              <br />
              Takoradi, Western Region
              <br />
              Ghana
            </span>
          </address>
          <p className="mt-4 pl-7 text-xs text-ivory/50">Front desk · 24/7</p>
          <a
            href={CONTACT.mapsHref}
            target="_blank"
            rel="noopener noreferrer"
            className="mt-4 inline-flex items-center gap-1.5 pl-7 text-[11px] font-bold uppercase tracking-[0.18em] text-accent transition-colors hover:text-gold-light"
          >
            Get directions
            <Icon name="arrowUpRight" className="h-3.5 w-3.5" />
          </a>
        </div>
      </div>

      <div className="container-x mt-14 flex flex-col items-center justify-between gap-4 border-t border-ivory/10 pt-7 text-xs text-ivory/45 sm:flex-row">
        <p>© 2026 BeKind Hotel &amp; Suites. All rights reserved.</p>
        <nav aria-label="Legal" className="flex gap-6">
          <a href="#about" className="transition-colors hover:text-accent">
            Privacy
          </a>
          <a href="#about" className="transition-colors hover:text-accent">
            Terms
          </a>
        </nav>
      </div>
    </footer>
  );
}

function StickyMobileBar({ onOpenBooking, onOpenPlanner }) {
  const [show, setShow] = useState(false);
  useEffect(() => {
    const onScroll = () => setShow(window.scrollY > 650);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return (
    <div
      className={cn(
        "fixed inset-x-3 bottom-3 z-40 flex gap-2 rounded-2xl border border-charcoal/10 bg-ivory/95 p-2 shadow-warm backdrop-blur transition-all duration-500 lg:hidden",
        show ? "translate-y-0 opacity-100" : "pointer-events-none translate-y-24 opacity-0"
      )}
    >
      <Button className="flex-1" onClick={onOpenBooking}>
        Book Your Stay
      </Button>
      <Button variant="outlineDark" onClick={onOpenPlanner}>
        Trip Planner
      </Button>
    </div>
  );
}

function App() {
  const [duration, setDuration] = useState(2);
  const [plannerOpen, setPlannerOpen] = useState(false);
  const [bookingOpen, setBookingOpen] = useState(false);
  const [presetRoomId, setPresetRoomId] = useState(null);

  function openBooking(roomId) {
    setPresetRoomId(roomId || null);
    setBookingOpen(true);
  }

  return (
    <React.Fragment>
      <a
        href="#main"
        className="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-[100] focus:rounded-full focus:bg-gold focus:px-5 focus:py-2.5 focus:text-xs focus:font-bold focus:uppercase focus:tracking-wider focus:text-ink"
      >
        Skip to content
      </a>

      <Navbar onOpenBooking={() => openBooking()} onOpenPlanner={() => setPlannerOpen(true)} />

      <main id="main">
        <Hero onOpenBooking={() => openBooking()} />
        <ExperienceIntro duration={duration} onDurationChange={setDuration} />
        <ItineraryTimeline nights={duration} onOpenPlanner={() => setPlannerOpen(true)} />
        <ExperienceCategoryGrid onOpenBooking={() => openBooking()} onOpenPlanner={() => setPlannerOpen(true)} />
        <RoomSection onSelectRoom={(roomId) => openBooking(roomId)} />
        <CTASection onOpenBooking={() => openBooking()} onOpenPlanner={() => setPlannerOpen(true)} />
      </main>

      <Footer />

      <StickyMobileBar onOpenBooking={() => openBooking()} onOpenPlanner={() => setPlannerOpen(true)} />

      <TripBuilder
        open={plannerOpen}
        onClose={() => setPlannerOpen(false)}
        onContinue={(roomId) => {
          setPlannerOpen(false);
          openBooking(roomId);
        }}
      />

      <BookingModal open={bookingOpen} presetRoomId={presetRoomId} onClose={() => setBookingOpen(false)} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
